[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sctq"
version = "0.1.0"
description = "SCTQ: Self-Consistent Tracking Quality - an annotation-free MOT evaluation framework"
readme = "README.md"
authors = [{ name = "SCTQ Authors" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "opencv-python>=4.6.0.66",
    "ultralytics>=8.0.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
